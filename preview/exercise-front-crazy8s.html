<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InnoDeck — Crazy 8's (Recto)</title>
  <link rel="stylesheet" href="../cards/css/variables.css">
  <link rel="stylesheet" href="../cards/css/card-base.css">
  <link rel="stylesheet" href="../cards/css/card-exercise.css">
</head>
<body>

  <div class="card card--exercise card--ideation">
    <!-- Fond -->
    <div class="card__background"></div>

    <!-- Bordure ornée -->
    <div class="card__border"></div>

    <!-- Coins ornementaux -->
    <div class="card__corner card__corner--tl">
      <svg viewBox="0 0 60 60" fill="none"><path d="M2 2 C2 2, 8 2, 12 4 C16 6, 18 10, 20 16 C22 22, 20 28, 18 32" stroke="#d4a44c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><path d="M2 2 C2 2, 2 8, 4 12 C6 16, 10 18, 16 20 C22 22, 28 20, 32 18" stroke="#d4a44c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><circle cx="4" cy="4" r="1.5" fill="#d4a44c" opacity="0.6"/></svg>
    </div>
    <div class="card__corner card__corner--tr">
      <svg viewBox="0 0 60 60" fill="none"><path d="M2 2 C2 2, 8 2, 12 4 C16 6, 18 10, 20 16 C22 22, 20 28, 18 32" stroke="#d4a44c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><path d="M2 2 C2 2, 2 8, 4 12 C6 16, 10 18, 16 20 C22 22, 28 20, 32 18" stroke="#d4a44c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><circle cx="4" cy="4" r="1.5" fill="#d4a44c" opacity="0.6"/></svg>
    </div>
    <div class="card__corner card__corner--bl">
      <svg viewBox="0 0 60 60" fill="none"><path d="M2 2 C2 2, 8 2, 12 4 C16 6, 18 10, 20 16 C22 22, 20 28, 18 32" stroke="#d4a44c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><path d="M2 2 C2 2, 2 8, 4 12 C6 16, 10 18, 16 20 C22 22, 28 20, 32 18" stroke="#d4a44c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><circle cx="4" cy="4" r="1.5" fill="#d4a44c" opacity="0.6"/></svg>
    </div>
    <div class="card__corner card__corner--br">
      <svg viewBox="0 0 60 60" fill="none"><path d="M2 2 C2 2, 8 2, 12 4 C16 6, 18 10, 20 16 C22 22, 20 28, 18 32" stroke="#d4a44c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><path d="M2 2 C2 2, 2 8, 4 12 C6 16, 10 18, 16 20 C22 22, 28 20, 32 18" stroke="#d4a44c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><circle cx="4" cy="4" r="1.5" fill="#d4a44c" opacity="0.6"/></svg>
    </div>

    <div class="card__inner">
      <!-- Zone illustration -->
      <div class="card__illustration">
        <img src="../cards/assets/illustrations/phase-ideation.png" alt="Idéation">
        <!-- Bannière phase -->
        <div class="card__category-banner">
          <span class="card__category-icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
          </span>
          Idéation
        </div>
        <div class="card__illustration-overlay"></div>
      </div>

      <!-- Titre -->
      <div class="card__title-zone">
        <h1 class="card__title">Crazy 8's</h1>
      </div>

      <!-- Badges moment -->
      <div class="card__badges">
        <span class="badge badge--moment">
          <span class="badge__icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 15.31L23.31 12 20 8.69V4h-4.69L12 .69 8.69 4H4v4.69L.69 12 4 15.31V20h4.69L12 23.31 15.31 20H20v-4.69zM12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
          </span>
          Début
        </span>
        <span class="badge badge--moment">
          <span class="badge__icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2H22l-6 4.8 2.4 7.2L12 16.8 5.6 21.2 8 14 2 9.2h7.6z"/></svg>
          </span>
          Milieu
        </span>
      </div>

      <!-- Métadonnées -->
      <div class="card__meta">
        <span class="card__meta-item">
          <span class="card__meta-icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
          </span>
          8 min
        </span>
        <span class="card__meta-item">
          <span class="card__meta-icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          </span>
          2-20
        </span>
        <span class="card__meta-item card__difficulty">
          <svg viewBox="0 0 24 24" fill="#d4a44c" style="width:2.5mm;height:2.5mm"><path d="M12 2l2.4 7.2H22l-6 4.8 2.4 7.2L12 16.8 5.6 21.2 8 14 2 9.2h7.6z"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="#8a7e6b" stroke-width="1.5" style="width:2.5mm;height:2.5mm;opacity:0.3"><path d="M12 2l2.4 7.2H22l-6 4.8 2.4 7.2L12 16.8 5.6 21.2 8 14 2 9.2h7.6z"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="#8a7e6b" stroke-width="1.5" style="width:2.5mm;height:2.5mm;opacity:0.3"><path d="M12 2l2.4 7.2H22l-6 4.8 2.4 7.2L12 16.8 5.6 21.2 8 14 2 9.2h7.6z"/></svg>
        </span>
      </div>

      <!-- Séparateur -->
      <div class="card__separator"></div>

      <!-- Objectif -->
      <div class="card__objective">
        <p>Générer un maximum d'idées visuelles en un minimum de temps, en forçant la pensée divergente.</p>
      </div>

      <!-- Footer -->
      <div class="card__footer">InnoDeck</div>
    </div>
  </div>

</body>
</html>
