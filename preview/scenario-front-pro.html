<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InnoDeck — L'accueil qui fait fuir (Recto)</title>
  <link rel="stylesheet" href="../cards/css/variables.css">
  <link rel="stylesheet" href="../cards/css/card-base.css">
  <link rel="stylesheet" href="../cards/css/card-scenario.css">
</head>
<body>

  <div class="card card--scenario card--pro-services">
    <!-- Fond -->
    <div class="card__background"></div>

    <!-- Bordure ornée -->
    <div class="card__border"></div>

    <!-- Coins ornementaux -->
    <div class="card__corner card__corner--tl">
      <svg viewBox="0 0 60 60" fill="none"><path d="M2 2 C2 2, 8 2, 12 4 C16 6, 18 10, 20 16 C22 22, 20 28, 18 32" stroke="#d4a44c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><path d="M2 2 C2 2, 2 8, 4 12 C6 16, 10 18, 16 20 C22 22, 28 20, 32 18" stroke="#d4a44c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><circle cx="4" cy="4" r="1.5" fill="#d4a44c" opacity="0.6"/></svg>
    </div>
    <div class="card__corner card__corner--tr">
      <svg viewBox="0 0 60 60" fill="none"><path d="M2 2 C2 2, 8 2, 12 4 C16 6, 18 10, 20 16 C22 22, 20 28, 18 32" stroke="#d4a44c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><path d="M2 2 C2 2, 2 8, 4 12 C6 16, 10 18, 16 20 C22 22, 28 20, 32 18" stroke="#d4a44c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><circle cx="4" cy="4" r="1.5" fill="#d4a44c" opacity="0.6"/></svg>
    </div>
    <div class="card__corner card__corner--bl">
      <svg viewBox="0 0 60 60" fill="none"><path d="M2 2 C2 2, 8 2, 12 4 C16 6, 18 10, 20 16 C22 22, 20 28, 18 32" stroke="#d4a44c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><path d="M2 2 C2 2, 2 8, 4 12 C6 16, 10 18, 16 20 C22 22, 28 20, 32 18" stroke="#d4a44c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><circle cx="4" cy="4" r="1.5" fill="#d4a44c" opacity="0.6"/></svg>
    </div>
    <div class="card__corner card__corner--br">
      <svg viewBox="0 0 60 60" fill="none"><path d="M2 2 C2 2, 8 2, 12 4 C16 6, 18 10, 20 16 C22 22, 20 28, 18 32" stroke="#d4a44c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><path d="M2 2 C2 2, 2 8, 4 12 C6 16, 10 18, 16 20 C22 22, 28 20, 32 18" stroke="#d4a44c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><circle cx="4" cy="4" r="1.5" fill="#d4a44c" opacity="0.6"/></svg>
    </div>

    <div class="card__inner">
      <!-- Zone illustration -->
      <div class="card__illustration">
        <img src="../cards/assets/illustrations/cat-pro-services.png" alt="En Entreprise — Services">
        <!-- Bannière catégorie -->
        <div class="card__category-banner">
          <span class="card__category-icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 7h-4V5c0-1.1-.9-2-2-2h-4C8.9 3 8 3.9 8 5v2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM10 5h4v2h-4V5z"/></svg>
          </span>
          En Entreprise · Services
        </div>
        <div class="card__illustration-overlay"></div>
      </div>

      <!-- Titre -->
      <div class="card__title-zone">
        <h1 class="card__title">L'accueil qui fait fuir</h1>
      </div>

      <!-- Séparateur -->
      <div class="card__separator"></div>

      <!-- Situation (question) -->
      <div class="card__situation">
        <p>La file d'attente à l'accueil de votre mairie décourage 40% des visiteurs avant même d'être reçus. Comment repenser le flux ?</p>
      </div>

      <!-- Footer -->
      <div class="card__footer">InnoDeck</div>

      <!-- Numéro -->
      <span class="card__number">#01</span>
    </div>
  </div>

</body>
</html>
